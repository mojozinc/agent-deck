[package]
name = "agent-deck-e2e-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-deck-core = { path = "../crates/agent-deck-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
egui = "0.29.1"
eframe = "0.29.1"

[[test]]
name = "tier1_feature_coverage"
path = "tier1_feature_coverage.rs"

[[test]]
name = "tier2_boundary_corner"
path = "tier2_boundary_corner.rs"

[[test]]
name = "tier3_cross_feature"
path = "tier3_cross_feature.rs"

[[test]]
name = "tier4_real_world_scenarios"
path = "tier4_real_world_scenarios.rs"

[[test]]
name = "tier5_adversarial_m1"
path = "tier5_adversarial_m1.rs"

